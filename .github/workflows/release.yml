name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to release (e.g. v2.0.1)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.21'

      - name: Validate release tag
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "release tag must be semantic versioning: ${RELEASE_TAG}" >&2
            exit 1
          fi
          test "$(git describe --tags --exact-match)" = "${RELEASE_TAG}"
          test "$(go list -m)" = "m31labs.dev/buckley"
          git merge-base --is-ancestor HEAD "origin/main"
          ./scripts/check-release.sh "${RELEASE_TAG}"

      - name: Publish GitHub release
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.13.1
          args: release --clean --skip=docker
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_DISABLE_SCM: "false"

      - name: Verify module installation
        env:
          GOPROXY: direct
          GONOSUMDB: m31labs.dev
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if go install "m31labs.dev/buckley/cmd/buckley@${RELEASE_TAG}"; then
              buckley version
              exit 0
            fi
            sleep 5
          done
          exit 1
