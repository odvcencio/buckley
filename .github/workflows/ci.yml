name: CI

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Detect affected surfaces
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          if [[ -z "${BASE_SHA}" ]]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
            echo "ui=true" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed="$(git diff --diff-filter=d --name-only "${BASE_SHA}" "${GITHUB_SHA}")"
          if grep -Eq '(^|/).+\.go$|^go\.(mod|sum)$|^scripts/(test|check-release)\.sh$|^\.github/workflows/ci\.yml$' <<<"${changed}"; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -Eq '^web/|^pkg/ipc/ui/|^scripts/build-ui\.sh$' <<<"${changed}"; then
            echo "ui=true" >> "$GITHUB_OUTPUT"
          else
            echo "ui=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -Eq '^(\.goreleaser\.yaml|CHANGELOG\.md|pkg/version/|build/docker/|scripts/(check-release|publish-containers)\.sh|\.github/workflows/release\.yml)' <<<"${changed}"; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Go
        if: steps.changes.outputs.go == 'true'
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install bubblewrap (execmode sandbox tests)
        if: steps.changes.outputs.go == 'true'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap
          # Ubuntu 24.04 runners restrict unprivileged user namespaces via
          # AppArmor, which breaks bwrap (and any userns-based sandbox
          # probe) with RTM_NEWADDR permission errors. Lift it for tests.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Check changed Go formatting
        if: steps.changes.outputs.go == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ -n "${BASE_SHA}" ]]; then
            mapfile -t files < <(git diff --diff-filter=d --name-only "${BASE_SHA}" "${GITHUB_SHA}" -- '*.go')
          else
            mapfile -t files < <(git ls-files '*.go')
          fi
          if (( ${#files[@]} == 0 )); then
            exit 0
          fi
          unformatted="$(gofmt -l "${files[@]}")"
          if [[ -n "${unformatted}" ]]; then
            echo "gofmt required on:" >&2
            echo "${unformatted}" >&2
            exit 1
          fi

      - name: Check module metadata
        if: steps.changes.outputs.go == 'true'
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Run Go tests
        if: steps.changes.outputs.go == 'true'
        run: ./scripts/test.sh

      - name: Check release metadata
        if: steps.changes.outputs.release == 'true'
        run: ./scripts/check-release.sh

      - name: Check GoReleaser configuration
        if: steps.changes.outputs.release == 'true'
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.13.1
          args: check

      - name: Set up Bun
        if: steps.changes.outputs.ui == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.21'

      - name: Build embedded UI
        if: steps.changes.outputs.ui == 'true'
        run: |
          ./scripts/build-ui.sh
          git diff --exit-code -- pkg/ipc/ui
