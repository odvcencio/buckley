name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Detect affected surfaces
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          # The shallow clone may not contain the base commit once main
          # moves ahead of the branch point, so fetch it on demand. When
          # the base cannot be resolved at all, treat every surface as
          # changed: running too much is safe, skipping checks is not.
          if [[ -n "${BASE_SHA}" ]] && ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "${BASE_SHA}" 2>/dev/null || true
          fi
          ./scripts/detect-affected-surfaces.sh

      - name: Check affected-surface detection
        run: bash ./scripts/tests/test_detect_affected_surfaces.sh

      - name: Check test script go-list failure handling
        run: bash ./scripts/tests/test_test_sh_go_list_failure.sh

      - name: Check deadcode script output handling
        run: bash ./scripts/tests/test_check_deadcode_output.sh

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install bubblewrap (execmode sandbox tests)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap
          # Ubuntu 24.04 runners restrict unprivileged user namespaces via
          # AppArmor, which breaks bwrap (and any userns-based sandbox
          # probe) with RTM_NEWADDR permission errors. Lift it for tests.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Check changed Go formatting
        if: steps.changes.outputs.go == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # Same base-availability caveat as the change detection above:
          # when the base commit is not in the clone, check every Go file
          # rather than silently checking none.
          if [[ -n "${BASE_SHA}" ]] && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            mapfile -t files < <(git diff --no-renames --diff-filter=d --name-only "${BASE_SHA}" "${GITHUB_SHA}" -- '*.go')
          else
            mapfile -t files < <(git ls-files '*.go')
          fi
          if (( ${#files[@]} == 0 )); then
            exit 0
          fi
          unformatted="$(gofmt -l "${files[@]}")"
          if [[ -n "${unformatted}" ]]; then
            echo "gofmt required on:" >&2
            echo "${unformatted}" >&2
            exit 1
          fi

      - name: Check module metadata
        if: steps.changes.outputs.go == 'true'
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Check unreachable functions
        if: steps.changes.outputs.go == 'true'
        run: ./scripts/check-deadcode.sh

      - name: Run Go tests
        run: ./scripts/test.sh

      - name: Check release metadata
        if: steps.changes.outputs.release == 'true'
        run: ./scripts/check-release.sh

      - name: Check GoReleaser configuration
        if: steps.changes.outputs.release == 'true'
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.13.1
          args: check

      - name: Check GoSX Mission Control UI
        if: steps.changes.outputs.ui == 'true'
        run: ./scripts/build-ui.sh
