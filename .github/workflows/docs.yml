name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  # Build (without deploying) on documentation pull requests. Without
  # this a docs-only PR reports no checks at all, so a broken nav link or
  # a missing page is only discovered after it lands on main.
  pull_request:
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  pages:
    name: Pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The Pages environment and deployment apply to main only; a pull
    # request run builds and stops.
    environment: ${{ github.event_name == 'push' && 'github-pages' || '' }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Build docs
        working-directory: docs
        run: |
          npm ci
          npm run build

      - name: Upload Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

      - name: Deploy Pages
        id: deployment
        if: github.event_name == 'push'
        uses: actions/deploy-pages@v4
