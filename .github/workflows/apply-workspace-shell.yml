name: Apply workspace shell

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.head_ref == 'agent/clickable-sidebar-activity' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: agent/clickable-sidebar-activity

      - name: Apply workspace source transform
        run: |
          cat scripts/workspace-parts/apply_workspace_shell.py.part01 \
              scripts/workspace-parts/apply_workspace_shell.py.part02 \
              > scripts/apply_workspace_shell.py
          python scripts/apply_workspace_shell.py

      - name: Format changed Go files
        run: |
          gofmt -w \
            pkg/ui/tui/app_widget.go \
            pkg/ui/tui/app_widget_keys.go \
            pkg/ui/tui/telemetry_bridge.go \
            pkg/ui/tui/tool_loop.go \
            pkg/ui/tui/workspace_layout.go \
            pkg/ui/tui/telemetry_activity.go \
            pkg/ui/tui/workspace_features_test.go \
            pkg/ui/widgets/sidebar.go \
            pkg/ui/widgets/chatview.go \
            pkg/ui/widgets/activity_panel.go \
            pkg/ui/widgets/markdown_workspace.go \
            pkg/ui/widgets/chatview_scrollbar.go \
            pkg/ui/widgets/workspace_features_test.go \
            pkg/ui/scrollback/semantic_scroll.go \
            pkg/ui/scrollback/semantic_scroll_test.go \
            pkg/tool/middleware_telemetry.go \
            pkg/tool/registry_events.go \
            pkg/tool/telemetry_detail.go \
            pkg/tool/telemetry_detail_test.go \
            pkg/subagent/manager.go

      - name: Run Go tests
        run: go test ./...

      - name: Commit applied workspace shell
        run: |
          rm -f scripts/01-workspace-shell.patch scripts/apply_workspace_shell.py
          rm -rf scripts/workspace-parts
          rm -f .github/workflows/apply-workspace-shell.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat(tui): add three-panel workspace shell [workspace-applied]"
          git push origin HEAD:agent/clickable-sidebar-activity
