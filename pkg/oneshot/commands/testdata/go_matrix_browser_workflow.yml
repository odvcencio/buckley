name: Test

on:
  pull_request:
  push:
    branches: [main, gophercon26]

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (${{ matrix.module }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        module: [".", examples/canopy-migration, examples/gophercon2026]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
      - name: Tests and race detector
        run: go test -race -count=1 ./...
      - name: Vet
        run: go vet ./...
      - name: Build CLI
        if: matrix.module == '.'
        run: go build ./cmd/slides

  browser:
    name: Browser (authoring, navigation, graphics, export)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "26"
      - run: npm ci --ignore-scripts
      - run: go build -o slides ./cmd/slides
      - name: Configure runner Chrome
        run: |
          capture_browser="$(command -v google-chrome)"
          printf '#!/bin/sh\nexec "%s" --no-sandbox "$@"\n' "$capture_browser" > chrome-capture
          chmod +x chrome-capture
          echo "SLIDES_BROWSER=$capture_browser" >> "$GITHUB_ENV"
          echo "SLIDES_CHROME=$PWD/chrome-capture" >> "$GITHUB_ENV"
      - run: node scripts/browser-ci.cjs ./slides
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: browser-export-evidence
          path: browser-test-output/
          if-no-files-found: ignore
